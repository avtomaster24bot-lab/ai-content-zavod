<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" role="img">
  <defs>
    <style>
      .t{font-family:Manrope,system-ui,sans-serif;fill:#14231f}
      .tm{font-family:Manrope,system-ui,sans-serif;fill:#4d5c57}
      .tw{font-family:Manrope,system-ui,sans-serif;fill:#fff}
      .serif{font-family:Fraunces,Georgia,serif;fill:#14231f}
    </style>
  </defs>
  <rect width="1100" height="620" rx="18" fill="#f4efe4"/>
<g><rect x="16" y="16" width="78" height="18" rx="4" fill="#f8ebc8"/><text x="24" y="29" font-size="10" font-weight="800" font-family="Manrope,system-ui,sans-serif" fill="#7a5604">СХЕМА</text></g>
<text x="110" y="30" class="serif" font-size="22">Карта завода: от идеи до денег</text>
<text x="110" y="50" class="tm" font-size="13">Вы — диспетчер. Агенты делают черновики. Публикация и продажа — с вашей проверкой.</text>
<a href="#stage-0"><rect x="40" y="80" width="180" height="70" rx="12" fill="#fffdf8" stroke="#0b6b62" stroke-width="2"/><text x="130.0" y="108" text-anchor="middle" class="t" font-size="12" font-weight="800">0. Подготовка</text><text x="130.0" y="128" text-anchor="middle" class="tm" font-size="11">позиция, база знаний</text></a>
<path d="M220 115 H250" stroke="#0b6b62" stroke-width="2"/>
<a href="#stage-1"><rect x="250" y="80" width="180" height="70" rx="12" fill="#fffdf8" stroke="#e3d6c3" stroke-width="2"/><text x="340.0" y="108" text-anchor="middle" class="t" font-size="12" font-weight="800">1. Закон и оплата</text><text x="340.0" y="128" text-anchor="middle" class="tm" font-size="11">ИП / Kaspi</text></a>
<path d="M430 115 H460" stroke="#0b6b62" stroke-width="2"/>
<a href="#stage-2"><rect x="460" y="80" width="180" height="70" rx="12" fill="#fffdf8" stroke="#e3d6c3" stroke-width="2"/><text x="550.0" y="108" text-anchor="middle" class="t" font-size="12" font-weight="800">2. Instagram</text><text x="550.0" y="128" text-anchor="middle" class="tm" font-size="11">профиль с нуля</text></a>
<path d="M640 115 H670" stroke="#0b6b62" stroke-width="2"/>
<a href="#stage-3"><rect x="670" y="80" width="180" height="70" rx="12" fill="#fffdf8" stroke="#e3d6c3" stroke-width="2"/><text x="760.0" y="108" text-anchor="middle" class="t" font-size="12" font-weight="800">3. Два агента</text><text x="760.0" y="128" text-anchor="middle" class="tm" font-size="11">радар + автор</text></a>
<path d="M850 115 H880" stroke="#0b6b62" stroke-width="2"/>
<a href="#stage-4"><rect x="880" y="80" width="180" height="70" rx="12" fill="#e4f3f0" stroke="#0b6b62" stroke-width="2"/><text x="970.0" y="108" text-anchor="middle" class="t" font-size="12" font-weight="800">4. Контент</text><text x="970.0" y="128" text-anchor="middle" class="tm" font-size="11">Reels / карусель</text></a>
<rect x="40" y="180" width="1020" height="54" rx="12" fill="#fff" stroke="#d89a12" stroke-width="2" stroke-dasharray="6 4"/>
<text x="550" y="202" text-anchor="middle" class="t" font-size="14" font-weight="800">Вы проверяете факты, правите «пластик» и только потом публикуете</text>
<text x="550" y="222" text-anchor="middle" class="tm" font-size="12">как у Ларри: черновик готовит агент, звук и кнопку «опубликовать» нажимаете вы</text>
<a href="#stage-5"><rect x="40" y="260" width="180" height="70" rx="12" fill="#f8ebc8" stroke="#d89a12" stroke-width="2"/><text x="130.0" y="288" text-anchor="middle" class="t" font-size="12" font-weight="800">5. Первые продажи</text><text x="130.0" y="308" text-anchor="middle" class="tm" font-size="11">пилоты 80–120 тыс. ₸</text></a>
<path d="M220 295 H250" stroke="#0b6b62" stroke-width="2"/>
<a href="#stage-6"><rect x="250" y="260" width="180" height="70" rx="12" fill="#fffdf8" stroke="#e3d6c3" stroke-width="2"/><text x="340.0" y="288" text-anchor="middle" class="t" font-size="12" font-weight="800">6. Кейсы</text><text x="340.0" y="308" text-anchor="middle" class="tm" font-size="11">3–5 историй клиентов</text></a>
<path d="M430 295 H460" stroke="#0b6b62" stroke-width="2"/>
<a href="#stage-7"><rect x="460" y="260" width="180" height="70" rx="12" fill="#fffdf8" stroke="#e3d6c3" stroke-width="2"/><text x="550.0" y="288" text-anchor="middle" class="t" font-size="12" font-weight="800">7. Курс / клуб</text><text x="550.0" y="308" text-anchor="middle" class="tm" font-size="11">после кейсов</text></a>
<path d="M640 295 H670" stroke="#0b6b62" stroke-width="2"/>
<a href="#stage-8"><rect x="670" y="260" width="180" height="70" rx="12" fill="#fffdf8" stroke="#e3d6c3" stroke-width="2"/><text x="760.0" y="288" text-anchor="middle" class="t" font-size="12" font-weight="800">8. Завод под ключ</text><text x="760.0" y="308" text-anchor="middle" class="tm" font-size="11">для тех, кто не хочет учиться</text></a>
<path d="M850 295 H880" stroke="#0b6b62" stroke-width="2"/>
<a href="#stage-9"><rect x="880" y="260" width="180" height="70" rx="12" fill="#fffdf8" stroke="#e3d6c3" stroke-width="2"/><text x="970.0" y="288" text-anchor="middle" class="t" font-size="12" font-weight="800">9. n8n</text><text x="970.0" y="308" text-anchor="middle" class="tm" font-size="11">конвейер + Telegram</text></a>
<a href="#stage-10"><rect x="40" y="360" width="200" height="70" rx="12" fill="#fffdf8" stroke="#e3d6c3" stroke-width="2"/><text x="140.0" y="388" text-anchor="middle" class="t" font-size="12" font-weight="800">10. ИИ-аватар</text><text x="140.0" y="408" text-anchor="middle" class="tm" font-size="11">позже, как бонус курса</text></a>
<rect x="260" y="360" width="800" height="70" rx="12" fill="#e4f3f0"/>
<text x="280" y="388" class="t" font-size="13" font-weight="800">Три выхода денег с самого начала</text>
<text x="280" y="410" class="t" font-size="13">прямые продажи пилотов рядом → готовые шаблоны и агенты → позже курс и завод под ключ</text>
<text x="40" y="470" class="t" font-size="13" font-weight="800">Поток одного материала</text>
<rect x="40" y="490" width="1020" height="100" rx="14" fill="#fff" stroke="#e3d6c3"/>
<rect x="55" y="510" width="140" height="60" rx="10" fill="#e4f3f0"/>
<text x="125" y="545" text-anchor="middle" class="t" font-size="11" font-weight="700">Тема в таблице</text>
<path d="M195 540 H215" stroke="#0b6b62" stroke-width="2"/>
<rect x="215" y="510" width="140" height="60" rx="10" fill="#e4f3f0"/>
<text x="285" y="545" text-anchor="middle" class="t" font-size="11" font-weight="700">Радар / автор</text>
<path d="M355 540 H375" stroke="#0b6b62" stroke-width="2"/>
<rect x="375" y="510" width="140" height="60" rx="10" fill="#e4f3f0"/>
<text x="445" y="545" text-anchor="middle" class="t" font-size="11" font-weight="700">Петля качества</text>
<path d="M515 540 H535" stroke="#0b6b62" stroke-width="2"/>
<rect x="535" y="510" width="140" height="60" rx="10" fill="#f8ebc8"/>
<text x="605" y="545" text-anchor="middle" class="t" font-size="11" font-weight="700">Ваша правка</text>
<path d="M675 540 H695" stroke="#0b6b62" stroke-width="2"/>
<rect x="695" y="510" width="140" height="60" rx="10" fill="#e4f3f0"/>
<text x="765" y="545" text-anchor="middle" class="t" font-size="11" font-weight="700">Ролик / карусель</text>
<path d="M835 540 H855" stroke="#0b6b62" stroke-width="2"/>
<rect x="855" y="510" width="140" height="60" rx="10" fill="#f8ebc8"/>
<text x="925" y="545" text-anchor="middle" class="t" font-size="11" font-weight="700">Черновик + музыка</text>
</svg>
